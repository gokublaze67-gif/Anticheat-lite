name: AntiCheatLite
version: '1.0.0'
main: com.example.anticheatlite.AntiCheatLite
api-version: '1.21'
author: You
description: Lightweight freecam-mitigation toolkit - visibility limiting, suspicious activity logging, and anti-xray guidance.

commands:
  acl:
    description: AntiCheatLite admin command
    usage: /acl <reload|flags|toggle>
    permission: anticheatlite.admin

permissions:
  anticheatlite.admin:
    description: Access to AntiCheatLite admin commands
    default: op
  anticheatlite.notify:
    description: Receive suspicious-activity flag notifications
    default: op
